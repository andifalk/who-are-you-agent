# Install as /etc/nginx/sites-available/expense.agile-dev.de.conf
# Certificate paths require prior issuance with certbot.
server {
  listen 80;
  server_name expense.agile-dev.de;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name expense.agile-dev.de;
  ssl_certificate /etc/letsencrypt/live/expense.agile-dev.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/expense.agile-dev.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;
  location = /mcp {
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header X-Accel-Buffering no always;
  }
  location / { return 404; }
}
