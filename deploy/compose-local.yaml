name: devfest-identity
# Run published images; configuration is loaded from deploy/.env.
services:
  travel-mcp:
    image: andifalk/travel-domain:latest
    environment:
      PORT: '8081'
      KEYCLOAK_ISSUER: ${TRAVEL_ISSUER:?required}
      JWT_AUDIENCE: ${TRAVEL_AUDIENCE:-travel-mcp}
      DEMO_SECURITY_MODE: delegated
      INSPECTOR_URL: http://inspector:8090
      INSPECTOR_API_KEY: ${INSPECTOR_API_KEY:?required}
    ports: ['127.0.0.1:${TRAVEL_PORT:-18081}:8081']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  expense-mcp:
    image: andifalk/expense-domain:latest
    environment:
      PORT: '8082'
      KEYCLOAK_ISSUER: ${TRAVEL_ISSUER:?required}
      JWT_AUDIENCE: ${EXPENSE_AUDIENCE:-expense-mcp}
      DEMO_SECURITY_MODE: delegated
      INSPECTOR_URL: http://inspector:8090
      INSPECTOR_API_KEY: ${INSPECTOR_API_KEY:?required}
    ports: ['127.0.0.1:${EXPENSE_PORT:-18082}:8082']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  inspector:
    image: andifalk/identity-inspector:latest
    environment:
      PORT: '8090'
      INSPECTOR_API_KEY: ${INSPECTOR_API_KEY:?required}
      INSPECTOR_DEMO_ENABLED: ${INSPECTOR_DEMO_ENABLED:-false}
    ports: ['127.0.0.1:${INSPECTOR_PORT:-18090}:8090']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  travel-agent:
    image: andifalk/travel-agent:latest
    env_file: ['.env']
    environment:
      PORT: '8083'
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?required}
      CORPORATE_CLIENT_SECRET: ${CORPORATE_CLIENT_SECRET:?required}
      TRAVEL_GRANT_CLIENT_SECRET: ${TRAVEL_GRANT_CLIENT_SECRET:?required}
      INSECURE_CLIENT_SECRET: ${INSECURE_CLIENT_SECRET:?required}
      INSPECTOR_URL: http://inspector:8090
      INSPECTOR_API_KEY: ${INSPECTOR_API_KEY:?required}
    ports: ['127.0.0.1:${AGENT_PORT:-18085}:8083']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
