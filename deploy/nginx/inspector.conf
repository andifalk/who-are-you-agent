# Public Inspector UI: HTTPS + Basic Auth. Obtain cert first; see deploy/README.md.
# Create /etc/nginx/inspector.htpasswd with htpasswd; keep it outside web root.
server {
    listen 80;
    server_name inspector.agile-dev.de;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name inspector.agile-dev.de;
    ssl_certificate /etc/letsencrypt/live/inspector.agile-dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inspector.agile-dev.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    auth_basic "DevFest Identity Inspector";
    auth_basic_user_file /etc/nginx/inspector.htpasswd;

    # Browser GET /api/events is SSE. NGINX must not buffer the stream.
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
